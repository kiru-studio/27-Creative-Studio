<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>27 Creative Studio - Imam Sahrudi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="poster">
    <!-- Top Header Wrap -->
    <div class="poster-header-wrap">
      <!-- Top Bar -->
      <header class="top-bar">
        <span>2024–2025</span>
        <div class="sparkle-divider">✦✦✦✦✦✦✦</div>
        <span>UNIDA GONTOR</span>
      </header>

      <!-- Main Brand Header (Single Line) -->
      <section class="brand-header">
        <div class="logo-27">
          <!-- Custom SVG matching the geometric 27 mark -->
          <svg viewBox="0 0 120 110" class="neon-svg">
            <polygon points="10,18 62,10 62,25 10,33" fill="#C6FF3D"/>
            <polygon points="68,9 112,2 112,17 68,24" fill="#C6FF3D"/>
            <path d="M10,45 L60,37 L60,55 L28,82 L62,77 L62,95 L8,103 L8,85 L40,58 L10,62 Z" fill="#C6FF3D"/>
            <polygon points="68,35 112,28 112,46 84,105 65,108 92,48 68,52" fill="#C6FF3D"/>
          </svg>
        </div>
        <h1 class="brand-title">CREATIVE STUDIO</h1>
      </section>
    </div>

    <!-- Wavy Neon Background Box -->
    <div class="wave-box">
      <svg viewBox="0 0 600 320" preserveAspectRatio="none">
        <defs>
          <pattern id="neon-waves" width="600" height="28" patternUnits="userSpaceOnUse">
            <path d="M0,14 Q150,-6 300,14 T600,14" fill="none" stroke="#C6FF3D" stroke-width="11"/>
          </pattern>
        </defs>
        <rect width="600" height="320" fill="url(#neon-waves)" />
      </svg>
    </div>

    <!-- Subject Cutout -->
    <div class="subject-wrapper">
      <img src="subject.png" alt="Imam Sahrudi" class="subject-img" />
    </div>

    <!-- Vertical Side Texts -->
    <div class="side-text left-text">ENERGI UNTUK<br>NEGERI</div>
    <div class="side-text right-text">GENERASI<br>BARU INDONESIA</div>

    <!-- Bottom Nameplate & Pill Badge -->
    <footer class="bottom-section">
      <div class="pill-badge">
        <svg viewBox="0 0 120 110" class="mini-logo">
          <polygon points="10,18 62,10 62,25 10,33" fill="#C6FF3D"/>
          <polygon points="68,9 112,2 112,17 68,24" fill="#C6FF3D"/>
          <path d="M10,45 L60,37 L60,55 L28,82 L62,77 L62,95 L8,103 L8,85 L40,58 L10,62 Z" fill="#C6FF3D"/>
          <polygon points="68,35 112,28 112,46 84,105 65,108 92,48 68,52" fill="#C6FF3D"/>
        </svg>
        <span>CREATIVE<br>STUDIO</span>
      </div>

      <div class="name-row">
        <h2 class="person-name">IMAM SAHRUDI</h2>
        <span class="star-accent">✦</span>
      </div>
      <p class="role-title">PUBLIKASI</p>
    </footer>
  </div>

</body>
</html>
